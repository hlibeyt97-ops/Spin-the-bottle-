

<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin The Bottle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #2c1a0e;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Oyun Masası */
        .table-container {
            position: relative;
            flex: 1;
            background: radial-gradient(circle, #e69d53 0%, #b36122 70%, #6e3205 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #4a2103;
        }
        /* Masadakı Oyunçular */
        .player {
            position: absolute;
            width: 70px;
            text-align: center;
        }
        .player img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            border: 2px solid #ffd700;
            object-fit: cover;
        }
        .player .name {
            font-size: 11px;
            margin-top: 4px;
            background: rgba(0,0,0,0.6);
            padding: 2px 4px;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Oyunçu Mövqeləri */
        .p-top-left { top: 15px; left: 25%; }
        .p-top-right { top: 15px; right: 25%; }
        .p-bottom { bottom: 15px; left: 50%; transform: translateX(-50%); }

        /* Fırlanan Şüşə */
        .bottle-container {
            width: 80px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .bottle {
            width: 40px;
            height: 120px;
            background: linear-gradient(90deg, #1e561e, #4caf50, #1e561e);
            border-radius: 20px 20px 8px 8px;
            position: relative;
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.25, 1);
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
        }
        .bottle::before {
            content: 'COCA';
            font-size: 8px;
            color: white;
            font-weight: bold;
            position: absolute;
            top: 50px;
            left: 5px;
            background: red;
            padding: 2px;
            border-radius: 2px;
        }

        /* Çat və Səs Paneli */
        .chat-section {
            height: 40%;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
        }
        .chat-msg {
            margin-bottom: 8px;
        }
        .chat-msg .user {
            color: #64b5f6;
            font-weight: bold;
        }
        .chat-input-area {
            display: flex;
            padding: 8px;
            background: #2a2a2a;
        }
        .chat-input-area input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: #3a3a3a;
            color: #fff;
        }
        .chat-input-area button {
            background: #ff9800;
            border: none;
            color: #fff;
            padding: 0 15px;
            margin-left: 8px;
            border-radius: 20px;
            cursor: pointer;
}

body {
    background: linear-gradient(135deg, #b87333 0%, #8b4513 50%, #4a2511 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

.bottle {
    width: 45px;
    height: 140px;
    background: linear-gradient(to right, rgba(0,0,0,0.3) 0%, rgba(255,255,255,0.4) 30%, rgba(27,94,32,0.85) 50%, rgba(0,0,0,0.4) 100%), #1b5e20;
    border-radius: 22px 22px 12px 12px;
    position: relative;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.3);
}

/* Şüşənin qapağı */
.bottle::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 14px;
    width: 17px;
    height: 10px;
    background: #d32f2f;
    border-radius: 4px 4px 0 0;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.6);
}

/* Üzərindəki qırmızı Coca-Cola etiketi */
.bottle::after {
    content: 'Coca-Cola';
    position: absolute;
    top: 48px;
    left: 2px;
    width: 41px;
    height: 18px;
    background: #d32f2f;
    color: white;
    font-size: 6.5px;
    font-weight: bold;
    text-align: center;
    line-height: 18px;
    border-radius: 3px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    transform: rotate(-3deg);

    </style>
</head>
<body>

    <!-- Masa & Oyunçular -->
    <div class="table-container">
        <div class="player p-top-left">
            <img src="https://via.placeholder.com/60" alt="Player 1">
            <div class="name">Спокойный 34</div>
        </div>
        <div class="player p-top-right">
            <img src="https://via.placeholder.com/60" alt="Player 2">
            <div class="name">Cran</div>
        </div>
        
        <!-- Fırlanacaq Şüşə -->
        <div class="bottle-container" onclick="spinBottle()">
            <div class="bottle" id="bottle"></div>
        </div>

        <div class="player p-bottom">
            <img src="https://via.placeholder.com/60" alt="You">
            <div class="name">Əli</div>
        </div>
    </div>

    <!-- Çat Hissəsi -->
    <div class="chat-section">
        <div class="chat-messages" id="chat">
            <div class="chat-msg"><span class="user">Farhod_571:</span> Arazchi</div>
            <div class="chat-msg"><span class="user">Nomalum:</span> Eee bayram qilayliiiik</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="msgInput" placeholder="Mesaj yaz...">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Ekranı tam açır

        let currentRotation = 0;
        let isSpinning = false;

        function spinBottle() {
            if (isSpinning) return;
            isSpinning = true;

            // Təsadüfi bucaq hesabla (ən azı 3-5 tam dövr + təsadüfi bucaq)
            const randomDegree = Math.floor(Math.random() * 360) + 1440; 
            currentRotation += randomDegree;

            const bottle = document.getElementById('bottle');
            bottle.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
            }, 3000);
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            if (input.value.trim() !== "") {
                const chat = document.getElementById('chat');
                const msg = document.createElement('div');
                msg.className = 'chat-msg';
                msg.innerHTML = `<span class="user">Sən:</span> ${input.value}`;
                chat.appendChild(msg);
                chat.scrollTop = chat.scrollHeight;
                input.value = "";
            }
        }
    </script>
</body>
</html>
