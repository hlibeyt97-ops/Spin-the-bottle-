<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin The Bottle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color, #0f0f1a); }
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(circle at top, #2a2a5a, #0a0a14);
    color: var(--tg-theme-text-color, #fff);
    font-family: system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; overflow:hidden;
  }
  h1{ letter-spacing:3px; margin:5px 0 2px; font-size:22px}
  #subtitle{opacity:.6; font-size:13px; margin-bottom:15px}
  #circle{
    width:300px; height:300px; border-radius:50%;
    border:2px dashed rgba(255,255,255,0.15);
    position:relative; display:flex; align-items:center; justify-content:center;
    margin:15px 0;
  }
  #bottle{
    font-size:75px; position:absolute; left:50%; top:50%;
    transform: translate(-50%,-50%) rotate(0deg);
    transition: transform 3.2s cubic-bezier(.15,.85,.25,1);
    filter: drop-shadow(0 0 15px rgba(0,255,170,0.6));
    z-index:10;
  }
  .player{
    position:absolute; width:58px; height:58px; background:#1e1e3a;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; text-align:center; line-height:1.1;
    border:2px solid rgba(255,255,255,0.25); transform: translate(-50%,-50%);
  }
  button{
    width:100%; max-width:320px; padding:14px; border-radius:999px; border:none;
    background: var(--tg-theme-button-color, #00ffaa); 
    color: var(--tg-theme-button-text-color, #000);
    font-weight:800; font-size:17px; cursor:pointer; margin-top:10px;
  }
  button.secondary{ background:transparent; border:1px solid rgba(255,255,255,0.25); color:white; font-size:14px; padding:10px }
  #status{ margin-top:18px; font-size:16px; min-height:22px; text-align:center }
  #players{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:10px }
  .pill{ background:rgba(255,255,255,0.12); padding:5px 10px; border-radius:999px; font-size:12px }
</style>
</head>
<body>
  <h1>SPIN THE BOTTLE</h1>
  <div id="subtitle">Telegram Edition</div>
  
  <div id="players"></div>
  <div id="circle"><div id="bottle">🍾</div></div>
  
  <button id="spinBtn">FIRLAT!</button>
  <div id="status">Hazırsan?</div>
  <button id="shareBtn" class="secondary">Nəticəni qrupa göndər</button>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  tg.enableClosingConfirmation();

  const bottle = document.getElementById('bottle');
  const spinBtn = document.getElementById('spinBtn');
  const statusEl = document.getElementById('status');
  const playersDiv = document.getElementById('players');
  const circle = document.getElementById('circle');

  let currentRotation = 0;
  let isSpinning = false;
  let lastWinner = "";

  // Telegram istifadəçisini al
  const user = tg.initDataUnsafe?.user;
  const myName = user ? user.first_name : "Sən";
  
  // Demo oyunçular - Telegram qrupunda oynayırsansa bura real adlar əlavə edə bilərsən
  let players = [
    {name: myName},
    {name: "Aysel"},
    {name: "Rauf"},
    {name: "Nigar"},
    {name: "Elvin"}
  ];

  function render(){
    playersDiv.innerHTML = "";
    document.querySelectorAll('.player').forEach(e=>e.remove());
    players.forEach((p,i)=>{
      const pill = document.createElement('div');
      pill.className='pill';
      pill.textContent = p.name;
      playersDiv.appendChild(pill);

      const angle = (i/players.length)*360;
      const rad = angle * Math.PI/180;
      const x = 150 + Math.cos(rad)*125;
      const y = 150 + Math.sin(rad)*125;
      const el = document.createElement('div');
      el.className='player';
      el.style.left = x+'px';
      el.style.top = y+'px';
      el.textContent = p.name;
      el.dataset.angle = angle;
      circle.appendChild(el);
    });
  }
  render();

  function spin(){
    if(isSpinning) return;
    isSpinning = true;
    if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    statusEl.textContent = "Fırlanır...";

    const extra = 1080 + Math.random()*1440; // 3-7 dövr
    const randomAngle = Math.random()*360;
    currentRotation += extra + randomAngle;
    bottle.style.transform = `translate(-50%,-50%) rotate(${currentRotation}deg)`;

    setTimeout(()=>{
      isSpinning = false;
      const norm = currentRotation % 360;
      let closest = null, minDiff = 999;
      document.querySelectorAll('.player').forEach(el=>{
        let a = parseFloat(el.dataset.angle);
        let target = (a + 90) % 360; // şüşənin ağzı
        let diff = Math.abs(norm - target);
        if(diff>180) diff = 360-diff;
        if(diff < minDiff){ minDiff = diff; closest = el.textContent; }
      });
      lastWinner = closest;
      statusEl.textContent = `Şüşə ${closest}-ə tuş gəldi! 🎉`;
      if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }, 3200);
  }

  spinBtn.addEventListener('click', spin);
  bottle.addEventListener('click', spin);

  document.getElementById('shareBtn').addEventListener('click', ()=>{
    if(!lastWinner) { tg.showAlert("Əvvəlcə fırlat!"); return; }
    const text = `🍾 Spin The Bottle: Şüşə ${lastWinner}-ə tuş gəldi!`;
    // Botuna data göndər və ya Telegram-da paylaş
    if(tg.sendData){
      // tg.sendData(lastWinner); // botun bunu qəbul etməsi üçün backend lazımdır
    }
    tg.switchInlineQuery(text, ["users","groups","channels"]);
  });
</script>
</body>
</html>
