<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin The Bottle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #b87333 0%, #8b4513 50%, #4a2511 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Oyun Masası */
        .table-container {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fırlanacaq Şüşə (Coca-Cola Dizaynı) */
        .bottle-container {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
        }

        .bottle {
            width: 45px;
            height: 140px;
            background: linear-gradient(to right, rgba(0,0,0,0.4) 0%, rgba(255,255,255,0.3) 30%, rgba(60, 20, 10, 0.9) 50%, rgba(20, 5, 2, 0.95) 100%), #2b1205;
            border-radius: 22px 22px 12px 12px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        /* Şüşənin qapağı */
        .bottle::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 14px;
            width: 17px;
            height: 10px;
            background: #d32f2f;
            border-radius: 4px 4px 0 0;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.6);
        }

        /* Üzərindəki qırmızı Coca-Cola etiketi */
        .bottle::after {
            content: 'Coca-Cola';
            position: absolute;
            top: 48px;
            left: 2px;
            width: 41px;
            height: 18px;
            background: #d32f2f;
            color: white;
            font-size: 6.5px;
            font-weight: bold;
            text-align: center;
            line-height: 18px;
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            transform: rotate(-3deg);
        }

        /* Oyunçu yerləri */
        .player {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #ff9800;
            object-fit: cover;
        }
        .player .name {
            margin-top: 5px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .p-top-left { top: 20px; left: 30px; }
        .p-top-right { top: 20px; right: 30px; }
        .p-bottom { bottom: 20px; }

        /* Çat hissəsi */
        .chat-section {
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            display: flex;
            flex-direction: column;
            max-height: 150px;
        }
        .chat-messages {
            overflow-y: auto;
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-msg span {
            color: #ff9800;
            font-weight: bold;
        }
        .chat-input-area {
            display: flex;
        }
        .chat-input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            color: #fff;
            border-radius: 20px;
            outline: none;
        }
        .chat-input-area button {
            background: #ff9800;
            border: none;
            color: #fff;
            padding: 0 15px;
            margin-left: 8px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Masa və Oyunçular -->
    <div class="table-container">
        <div class="player p-top-left">
            <img src="https://via.placeholder.com/60" alt="Player">
            <div class="name">Spokoynıy</div>
        </div>
        <div class="player p-top-right">
            <img src="https://via.placeholder.com/60" alt="Player">
            <div class="name">Cran</div>
        </div>

        <!-- Fırlanacaq Şüşə -->
        <div class="bottle-container">
            <div class="bottle" id="bottle"></div>
        </div>

        <div class="player p-bottom">
            <img src="https://via.placeholder.com/60" alt="Player">
            <div class="name">Əli</div>
        </div>
    </div>

    <!-- Çat Hissəsi -->
    <div class="chat-section">
        <div class="chat-messages" id="chat-messages">
            <div class="chat-msg"><span>Farhod_571:</span> Arazchi</div>
            <div class="chat-msg"><span>Nomalum:</span> Eee bayram qilayiiiiik</div>
        </div>
        <div class="chat-input-area">
            <input type="text" placeholder="Mesaj yaz...">
            <button>➔</button>
        </div>
    </div>

    <script>
        const bottle = document.getElementById('bottle');
        let currentRotation = 0;

        bottle.parentElement.addEventListener('click', () => {
            const randomSpin = Math.floor(Math.random() * 1440) + 720;
            currentRotation += randomSpin;
            bottle.style.transition = 'transform 2s cubic-bezier(0.15, 0.85, 0.25, 1)';
            bottle.style.transform = `rotate(${currentRotation}deg)`;
        });
    </script>
</body>
</html>
