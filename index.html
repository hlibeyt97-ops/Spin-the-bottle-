<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin The Bottle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #b87333 0%, #8b4513 50%, #4a2511 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Üst Panel */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        .top-left, .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .icon-btn {
            background: #d32f2f;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .icon-btn.orange {
            background: #ff9800;
        }
        .badge-tag {
            background: #d32f2f;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .circle-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #ff9800;
            border: none;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .circle-btn .red-dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 8px;
            height: 8px;
            background: #ff0000;
            border-radius: 50%;
            border: 1px solid #fff;
        }
        .table-info {
            background: #ff9800;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Açılan Menyü (Dropdown) */
        .dropdown-menu {
            position: absolute;
            top: 55px;
            right: 15px;
            background: white;
            color: #333;
            border-radius: 12px;
            width: 170px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
        }
        .dropdown-menu.active {
            display: flex;
        }
        .dropdown-item {
            padding: 12px 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            position: relative;
        }
        .dropdown-item:last-child {
            border-bottom: none;
        }
        .dropdown-item:hover {
            background: #f5f5f5;
        }
        .dropdown-item .red-dot {
            width: 8px;
            height: 8px;
            background: red;
            border-radius: 50%;
            margin-left: auto;
        }

        /* Oyun Masası */
        .table-container {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Oyun Status Mesajı */
        .game-status {
            position: absolute;
            top: 38%;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* Fırlanacaq Şüşə (Coca-Cola Dizaynı) */
        .bottle-container {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
        }

        .bottle {
            width: 45px;
            height: 140px;
            background: linear-gradient(to right, rgba(0,0,0,0.4) 0%, rgba(255,255,255,0.3) 30%, rgba(60, 20, 10, 0.9) 50%, rgba(20, 5, 2, 0.95) 100%), #2b1205;
            border-radius: 22px 22px 12px 12px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .bottle::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 14px;
            width: 17px;
            height: 10px;
            background: #d32f2f;
            border-radius: 4px 4px 0 0;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.6);
        }

        .bottle::after {
            content: 'Coca-Cola';
            position: absolute;
            top: 48px;
            left: 2px;
            width: 41px;
            height: 18px;
            background: #d32f2f;
            color: white;
            font-size: 6.5px;
            font-weight: bold;
            text-align: center;
            line-height: 18px;
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            transform: rotate(-3deg);
        }

        /* Çat hissəsi */
        .chat-section {
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            display: flex;
            flex-direction: column;
            max-height: 150px;
        }
        .chat-messages {
            overflow-y: auto;
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-msg span {
            color: #ff9800;
            font-weight: bold;
        }
        .chat-input-area {
            display: flex;
        }
        .chat-input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            color: #fff;
            border-radius: 20px;
            outline: none;
        }
        .chat-input-area button {
            background: #ff9800;
            border: none;
            color: #fff;
            padding: 0 15px;
            margin-left: 8px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Üst Panel -->
    <div class="top-bar">
        <div class="top-left">
            <button class="icon-btn">❤️ 2</button>
            <button class="icon-btn orange">⚔️</button>
            <span class="badge-tag">#20</span>
        </div>
        <div class="top-right">
            <div class="table-info">Masa 510 🔄</div>
            <button class="circle-btn" id="settings-btn">⚙️</button>
            <button class="circle-btn" id="menu-toggle">
                ☰
                <span class="red-dot"></span>
            </button>
        </div>
    </div>

    <!-- Açılan Menyü -->
    <div class="dropdown-menu" id="dropdown-menu">
        <div class="dropdown-item">💬 Mesajlar</div>
        <div class="dropdown-item">🏆 Başarılar <span class="red-dot"></span></div>
        <div class="dropdown-item">📊 Puanlar</div>
        <div class="dropdown-item">🍾 Şişe</div>
        <div class="dropdown-item">🖼️ Stil</div>
        <div class="dropdown-item">⚡ Booster'lar</div>
    </div>

    <!-- Masa və Şüşə -->
    <div class="table-container">
        <!-- Oyun Statusu -->
        <div class="game-status">Kızların oyunu başlatmasını bekleniyor</div>

        <!-- Fırlanacaq Şüşə -->
        <div class="bottle-container">
            <div class="bottle" id="bottle"></div>
        </div>
    </div>

    <!-- Çat Hissəsi -->
    <div class="chat-section">
        <div class="chat-messages" id="chat-messages">
            <div class="chat-msg"><span>Farhod_571:</span> Arazchi</div>
            <div class="chat-msg"><span>Nomalum:</span> Eee bayram qilayiiiiik</div>
        </div>
        <div class="chat-input-area">
            <input type="text" placeholder="Mesaj yaz...">
            <button>➔</button>
        </div>
    </div>

    <script>
        // Menyü açılıb-bağlanması
        const menuToggle = document.getElementById('menu-toggle');
        const dropdownMenu = document.getElementById('dropdown-menu');

        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('active');
        });

        window.addEventListener('click', () => {
            dropdownMenu.classList.remove('active');
        });

        // Şüşə fırlatmaq məntiqi
        const bottle = document.getElementById('bottle');
        let currentRotation = 0;

        bottle.parentElement.addEventListener('click', () => {
            const randomSpin = Math.floor(Math.random() * 1440) + 720;
            currentRotation += randomSpin;
            bottle.style.transition = 'transform 2s cubic-bezier(0.15, 0.85, 0.25, 1)';
            bottle.style.transform = `rotate(${currentRotation}deg)`;
        });
    </script>
</body>
</html>
